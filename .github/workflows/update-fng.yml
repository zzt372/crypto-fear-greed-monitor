name: Update Crypto Fear & Greed

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fetch_fng.py"
      - ".github/workflows/update-fng.yml"

permissions:
  contents: write

concurrency:
  group: update-crypto-fear-greed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate Alternative.me official API
        run: python fetch_fng.py

      - name: Commit latest.json when refreshed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Crypto Fear & Greed data"
          git push
