name: Update Crypto Fear & Greed

on:
  schedule:
    # GitHub's minimum supported schedule interval is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fetch_fng.py"
      - "test_fetch_fng.py"
      - ".github/workflows/update-fng.yml"

permissions:
  contents: write

concurrency:
  group: update-crypto-fear-greed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest -v test_fetch_fng.py

      - name: Fetch and validate Alternative.me official API
        run: python fetch_fng.py

      - name: Suppress unchanged-category commit churn
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("latest.json")
          new = json.loads(path.read_text(encoding="utf-8"))

          try:
              old_raw = subprocess.check_output(
                  ["git", "show", "HEAD:latest.json"], text=True
              )
              old = json.loads(old_raw)
          except Exception:
              raise SystemExit(0)

          # Classification changes and a new provider timestamp should be
          # published immediately. Otherwise keep only an hourly heartbeat.
          material_change = any(
              old.get(key) != new.get(key)
              for key in (
                  "value_classification",
                  "timestamp",
                  "ok",
                  "source",
                  "endpoint",
              )
          )
          if material_change:
              print("Material change detected; keep refreshed latest.json")
              raise SystemExit(0)

          try:
              text = str(old.get("fetched_at", "")).replace("Z", "+00:00")
              old_fetched = datetime.fromisoformat(text).astimezone(timezone.utc)
              age = datetime.now(timezone.utc) - old_fetched
          except Exception:
              raise SystemExit(0)

          if age.total_seconds() < 3600:
              subprocess.run(
                  ["git", "checkout", "HEAD", "--", "latest.json"],
                  check=True,
              )
              print("Classification unchanged and heartbeat <1h; skip commit")
          else:
              print("Hourly heartbeat due; keep refreshed latest.json")
          PY

      - name: Commit latest.json when refreshed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Crypto Fear & Greed data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "git push failed after 3 attempts" >&2
              exit 1
            fi

            echo "Push attempt $attempt failed; rebasing and retrying..." >&2
            sleep $((attempt * 2))
            git fetch origin main
            git rebase origin/main
          done
